
<!DOCTYPE html>
<html>
<head>
  <title>Tugas 1 Biodata</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e0f2fe, #bfdbfe);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: white;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      text-align: center;
      width: 320px;
    }
    h2 {
      color: #1e40af;
      margin-bottom: 15px;
    }
    #biodata p {
      margin: 6px 0;
      color: #1f2937;
      font-weight: 500;
    }
    img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin: 12px 0;
      border: 3px solid #3b82f6;
    }
    button {
      margin: 4px 2px;
      padding: 7px 12px;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
<div class="card">
  <h2>Biodata Mahasiswa</h2>
  <div id="biodata">
    <p id="nama">Nama: Syifa Fauzia</p>
    <p id="nim">NIM: 0110125067</p>
    <p id="prodi">Program Studi: sistem informasi</p>
    <img id="foto" src="zioo.jpg">
  </div>

  <button onclick="ubahNama()">Ubah Nama</button>
  <button onclick="ubahProdi()">Ubah Prodi</button>
  <button onclick="gantiFoto()">Ganti Foto</button><br>
  <button onclick="sembunyi()">Sembunyikan</button>
  <button onclick="tampil()">Tampilkan</button>

  <script>
  function ubahNama(){
    document.getElementById("nama").innerHTML = "Nama: Budi Santoso";
  }
  function ubahProdi(){
    document.getElementById("prodi").innerHTML = "Program Studi: Sistem Informasi";
  }
  function gantiFoto(){
    document.getElementById("foto").setAttribute("src","zion.jpg");
  }
  function sembunyi(){
    document.getElementById("biodata").style.display="none";
  }
  function tampil(){
    document.getElementById("biodata").style.display="block";
  }
  </script>
</div>
</body>
</html>
